name: Notify Discord

on:
  push:
    branches: [ "main" ]
  pull_request:
    types: [opened, closed]
  issues:
    types: [opened, closed]

jobs:
  discord:
    runs-on: ubuntu-latest
    steps:
      - name: Notify Discord
        uses: ilshidur/action-discord@v2
        with:
          webhook_id: ${{ secrets.DISCORD_WEBHOOK_ID }}
          webhook_token: ${{ secrets.DISCORD_WEBHOOK_TOKEN }}
          message: |
             Repo: ${{ github.repository }}
             Evento: ${{ github.event_name }}
             URL: ${{ github.event.pull_request.html_url || github.event.head_commit.url || github.event.issue.html_url }}
